# ============================================================================
# 生产级 docker compose 编排
#   服务清单：
#     mysql       — 持久化 + utf8mb4 + 健康检查
#     redis       — AOF 持久化 + 密码（可选）+ 健康检查
#     backend     — FastAPI（uvicorn，--proxy-headers）
#     celery      — 共用 backend 镜像，消费 eval/agent 队列
#     frontend    — nginx 静态托管 + /api 反代 + HTTPS 终结（监听 80/443）
#     minio       — 对象存储（其它项目共用；/file 匿名读 + <桶名>.s3.<域名> 每桶子域公网 S3 API + console.<域名> 控制台）
#
#   网络：默认 bridge 网络 resume_net，服务间通过服务名互联
#   持久化：mysql_data / redis_data / resume_storage / langgraph_data / backend_logs / minio_data
#           宿主机 ./letsencrypt（证书）与 ./certbot-webroot（ACME 挑战）
#   启动顺序：mysql/redis healthy → backend → celery & frontend
#
# 证书：由宿主机 certbot 一次性签发并放到 ./letsencrypt（详见 OPERATION.md §4）
# 配置：所有敏感项通过 .env.production 注入，本目录提供 .env.production.example 模板
# 使用：
#   cp deploy/.env.production.example deploy/.env.production
#   编辑 .env.production（WEB_DOMAIN 必填）
#   bash deploy/scripts/init-cert.sh        # 首次签证
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env.production up -d --build
# ============================================================================

name: resume-platform

services:
  # ------------------------------ MySQL ------------------------------
  mysql:
    image: mysql:latest
    container_name: resume_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-connections=500
      - --innodb-buffer-pool-size=512M
    volumes:
      - mysql_data:/var/lib/mysql
    # 仅在本机暴露端口便于运维连接；生产强烈建议注释掉，让 MySQL 只在内网可达
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [resume_net]

  # ------------------------------ Redis ------------------------------
  redis:
    image: redis:latest
    container_name: resume_redis
    restart: unless-stopped
    # ${REDIS_PASSWORD:-} 为空时也能启动（仅靠网络隔离）；线上务必设密码
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      # 同时兼容有/无密码场景
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks: [resume_net]

  # ------------------------------ FastAPI ------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: resume-platform/backend:${IMAGE_TAG:-latest}
    container_name: resume_backend
    restart: unless-stopped
    depends_on:
      mysql:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    env_file:
      - .env.production
    # 容器内访问 mysql/redis 用服务名，覆盖 .env 中的 127.0.0.1
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      LOCAL_STORAGE_PATH: /app/note
      LANGGRAPH_SQLITE_PATH: /app/data/langgraph_checkpoints.sqlite
    volumes:
      # 简历附件 / 上传文件持久化
      - resume_storage:/app/note
      # LangGraph 中断态 checkpointer 持久化（容器重启不丢 Agent 会话）
      - langgraph_data:/app/data
      - backend_logs:/app/logs
    expose:
      - "8000"
    healthcheck:
      # FastAPI 默认提供 /docs，能 200 说明应用与 ASGI 都就绪
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/docs"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [resume_net]

  # ------------------------------ Celery Worker ------------------------------
  celery:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: resume-platform/backend:${IMAGE_TAG:-latest}
    container_name: resume_celery
    restart: unless-stopped
    depends_on:
      mysql:    { condition: service_healthy }
      redis:    { condition: service_healthy }
      backend:  { condition: service_started }
    env_file:
      - .env.production
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      LOCAL_STORAGE_PATH: /app/note
    volumes:
      # 与 backend 共享附件，eval_task 才能读到上传的简历
      - resume_storage:/app/note
      - backend_logs:/app/logs
    # 队列从 celery_app.ALL_QUEUES 动态读取，新增 task 模块无需改这里
    command:
      - sh
      - -c
      - >
        QUEUES=$$(python -c "from app.workers.celery_app import ALL_QUEUES; print(ALL_QUEUES)")
        && echo "[celery] consuming queues: $$QUEUES"
        && exec celery -A app.workers.celery_app:celery_app worker
        --loglevel=INFO
        --concurrency=4
        --pool=threads
        -Q $$QUEUES
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [resume_net]

  # ------------------------------ Frontend / Nginx + HTTPS ------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: resume-platform/frontend:${IMAGE_TAG:-latest}
    container_name: resume_frontend
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
    environment:
      # nginx:latest 入口脚本会用 envsubst 把模板里的 ${变量} 替换到 default.conf
      WEB_DOMAIN: ${WEB_DOMAIN}
      # S3 公网 API 独立子域：对应模板第二个 443 server 块（证书签发见 md/minio/s3-subdomain-guide.md）
      S3_DOMAIN: ${S3_DOMAIN}
      # MinIO Web 控制台子域：对应模板第三个 443 server 块（证书签发见 md/minio/console-subdomain-guide.md）
      MINIO_CONSOLE_DOMAIN: ${MINIO_CONSOLE_DOMAIN}
      # 只允许下列变量被替换，避免 nginx 配置里的 $host / $remote_addr 被误替
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: ".template"
      NGINX_ENVSUBST_FILTER: "WEB_DOMAIN|S3_DOMAIN|MINIO_CONSOLE_DOMAIN"
    volumes:
      # 证书目录（由宿主机 certbot 写入；容器只读）
      - ./letsencrypt:/etc/letsencrypt:ro
      # ACME http-01 挑战 webroot：续期时 certbot 会往这里写校验文件
      - ./certbot-webroot:/var/www/certbot
    healthcheck:
      # 走 HTTPS 自检，--no-check-certificate 避免本地 SAN 校验
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [resume_net]

  # ------------------------------ MinIO 对象存储（供其它项目共用） ------------------------------
  # 访问路径设计（详见 md/minio/ 操作文档）：
  #   S3 API   — 容器内 http://minio:9000（nginx 将 https://<域名>/file/ 反代到这里做匿名公开读）
  #              宿主机 127.0.0.1:9000（同机其它项目的 SDK/mc 走这个，含签名，不经 /file）
  #   Console  — 宿主机 127.0.0.1:9001，仅限 SSH 隧道访问，不对公网开放
  minio:
    image: pgsty/minio:latest
    container_name: resume_minio
    restart: unless-stopped
    # 内存上限：防元数据/缓存随对象数量增长吃爆宿主内存；对象规模上来后再调
    mem_limit: 512m
    environment:
      # root 凭证从 .env.production 注入（既是控制台账号也是管理用 AccessKey，生产必须强密码）
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # 开启 virtual-hosted（每桶一个子域：<桶名>.s3.<域名> 直达对应桶，复刻阿里云 OSS 风格）
      # 值为 S3_DOMAIN（不带通配符）；为空则保持 path-style，仅内网/ /file 使用
      MINIO_DOMAIN: ${S3_DOMAIN}
      # 控制台对外地址（登录后重定向用）；为空则控制台仅内网/SSH 隧道访问
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-}
      # 公网 S3 API 完整地址：控制台生成的分享/预签名链接会以它为基准（否则按服务器自报地址
      # http://127.0.0.1:9000 生成，公网不可用，只能靠控制台代理兜底）；为空则不设置
      MINIO_SERVER_URL: ${MINIO_API_URL:-}
    # 单机单盘模式；--console-address 把 Console 端口固定到 9001（默认随机，端口映射必须固定）
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      # 仅绑宿主机回环：S3 API 与 Console 都不直接暴露公网，公网下载统一收敛到 nginx /file（443/TLS）
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      # mc 为镜像自带 CLI，ready 会真正等部署可读写，比纯进程探活更可靠
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [resume_net]

# ============================================================================
volumes:
  mysql_data:
  redis_data:
  resume_storage:    # 简历原文件 & note/
  langgraph_data:    # LangGraph SqliteSaver checkpoints
  backend_logs:
  minio_data:        # MinIO 对象数据（其它项目共用存储）

networks:
  resume_net:
    driver: bridge
